  <style>
    /* ============================================================
     * WIDGET-SPECIFIC LAYOUT
     * ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: var(--ff-sans);
      color: var(--on-surface);
      background: transparent;
      overflow-y: hidden;
    }

    .widget-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Summary Card */
    .header-card {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: var(--r-l, 16px);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .header-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .header-title {
      margin: 0;
      color: var(--on-surface);
      font-size: 18px;
      font-weight: 500;
      line-height: 24px;
    }

    .header-subtitle {
      margin: 0;
      color: var(--on-surface-variant);
      font-size: 13px;
      font-family: var(--ff-mono);
      line-height: 18px;
    }

    /* Status Pill Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--r-full, 999px);
      font-size: 13px;
      font-family: var(--ff-mono);
      font-weight: 500;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      white-space: nowrap;
    }

    .status-badge.normal {
      background: var(--positive-container);
      color: var(--positive);
      border: 1px solid var(--positive);
    }

    .status-badge.failover {
      background: var(--error-container);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .status-dot.pulse {
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1.0; }
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric-box {
      background: var(--surface-dim);
      padding: 8px 12px;
      border-radius: var(--r-s, 8px);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .metric-label {
      font-size: 11px;
      color: var(--on-surface-variant);
      font-family: var(--ff-mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--on-surface);
      font-family: var(--ff-mono);
      line-height: 20px;
      transition: color 0.25s ease;
    }

    .metric-value.positive { color: var(--positive); }

    /* Control Deck */
    .controls-deck {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--surface-dim);
      padding: 6px;
      border-radius: var(--r-full, 999px);
      border: 1px solid var(--stroke-default);
    }

    .state-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 16px;
      border-radius: var(--r-full, 999px);
      font-family: var(--ff-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--on-surface-variant);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .state-btn:hover {
      color: var(--on-surface);
      background: var(--surface-container-high);
    }

    .state-btn.active {
      background: var(--accent-container);
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* SVG Viewport Container */
    .diagram-viewport {
      background: var(--surface-bright);
      border: 1px solid var(--stroke-default);
      border-radius: var(--r-l, 16px);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
    }

    /* SVG Animation and Transitions */
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dash-flow 1.2s linear infinite;
    }

    @keyframes dash-flow {
      to { stroke-dashoffset: -24; }
    }

    .node-element {
      transition: opacity 0.3s ease;
    }

    .fade-dim { opacity: 0.25; }

    /* Broken / disrupted routes (failover visuals) */
    .route-broken {
      stroke-dasharray: 3 5;
      opacity: 0.7;
    }

    .fiber-broken {
      stroke-dasharray: 2 6;
      opacity: 0.4;
    }

    text {
      stroke: none !important;
      paint-order: fill;
    }

    /* Reduced motion: honor user preference */
    @media (prefers-reduced-motion: reduce) {
      .flow-line,
      .status-dot.pulse {
        animation: none !important;
      }
      .node-element,
      .metric-value,
      .status-badge {
        transition: none !important;
      }
    }

    /* Narrow screen: keep the metrics readable */
    @media (max-width: 480px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
      .header-card { padding: 12px 14px; }
      .state-btn { font-size: 12px; padding: 8px 10px; }
    }

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

    <div class="header-card">
      <div class="header-top">
        <div class="header-title-group">
          <h2 class="header-title">Arquitectura Georredundante Bancaria</h2>
          <span class="header-subtitle">Replicación Síncrona en Bloque DWDM &amp; Data Center Alterno (35 km)</span>
        </div>
        <div id="status-badge" class="status-badge normal" role="status" aria-live="polite">
          <span class="status-dot pulse" aria-hidden="true"></span>
          <span id="status-text">Operación Normal</span>
        </div>
      </div>

      <div class="metrics-grid" aria-live="polite" aria-atomic="true">
        <div class="metric-box">
          <span class="metric-label">RPO (Objetivo Punto)</span>
          <span id="metric-rpo" class="metric-value">0 (Cero Pérdida)</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Latencia de Enlace</span>
          <span id="metric-latency" class="metric-value">&lt; 2.8 ms</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">RTO (Tiempo Conmut.)</span>
          <span id="metric-rto" class="metric-value">&lt; 15 seg (Auto)</span>
        </div>
      </div>
    </div>

    <!-- Control Selector -->
    <div class="controls-deck" role="group" aria-label="Seleccionar estado del sistema">
      <button id="btn-normal" type="button" class="state-btn active" aria-pressed="true">
        Operación Normal (Síncrona)
      </button>
      <button id="btn-failover" type="button" class="state-btn" aria-pressed="false">
        Escenario de Falla (Failover DC2)
      </button>
    </div>

    <!-- SVG Architecture Canvas -->
    <div class="diagram-viewport">
      <svg id="arch-svg" viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Diagrama de arquitectura georredundante bancaria</title>
        <desc id="svg-desc">Dos centros de datos (DC1 y DC2) interconectados por doble anillo de fibra oscura DWDM con replicación síncrona en bloque. Un GSLB/Anycast BGP enruta el tráfico a DC1 en operación normal y a DC2 en caso de failover. Un árbitro de quórum en sitio neutral (cloud) resuelve el split-brain.</desc>

        <defs>
          <!-- Open Caret Arrowhead Markers -->
          <marker id="lumi-caret" viewBox="0 0 10 10" refX="7.5" refY="5"
                  markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--on-surface)"
                  stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>

          <marker id="caret-active" viewBox="0 0 10 10" refX="7.5" refY="5"
                  markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--primary)"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>

          <marker id="caret-failover" viewBox="0 0 10 10" refX="7.5" refY="5"
                  markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--error)"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

        <!-- ================= CAPA 1: CANALES BANCARIOS ================= -->
        <g id="layer-channels">
          <g class="node-element" transform="translate(30, 20)">
            <rect x="0" y="0" width="160" height="48" rx="24" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="80" y="22" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" fill="var(--on-surface)">Banca Móvil / Web</text>
            <text x="80" y="37" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">HTTPS / TLS 1.3</text>
          </g>

          <g class="node-element" transform="translate(240, 20)">
            <rect x="0" y="0" width="160" height="48" rx="24" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="80" y="22" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" fill="var(--on-surface)">40 Agencias</text>
            <text x="80" y="37" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">Red Privada MPLS</text>
          </g>

          <g class="node-element" transform="translate(450, 20)">
            <rect x="0" y="0" width="160" height="48" rx="24" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="80" y="22" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" fill="var(--on-surface)">Red Cajeros ATM</text>
            <text x="80" y="37" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">ISO 8583 / IPsec</text>
          </g>
        </g>

        <!-- Lines: Channels -> GSLB -->
        <path d="M 110 68 L 110 92 Q 110 102 125 102 L 230 102" fill="none" stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"/>
        <path d="M 320 68 L 320 102" fill="none" stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"/>
        <path d="M 530 68 L 530 92 Q 530 102 515 102 L 410 102" fill="none" stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"/>

        <!-- ================= CAPA 2: ENRUTAMIENTO GSLB & WITNESS ================= -->
        <g id="node-gslb" class="node-element" transform="translate(230, 92)">
          <rect id="gslb-rect" x="0" y="0" width="180" height="44" rx="22" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
          <text x="90" y="20" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" font-weight="500" fill="var(--on-surface)">GSLB / Anycast BGP</text>
          <text id="gslb-sub" x="90" y="34" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--primary)">Ruta: DC1 Principal</text>
        </g>

        <g id="node-witness" class="node-element" transform="translate(480, 92)">
          <rect x="0" y="0" width="130" height="44" rx="12" fill="var(--surface-dim)" stroke="var(--outline)" stroke-width="1.2"/>
          <text x="65" y="20" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="12" fill="var(--on-surface)">Árbitro Quorum</text>
          <text x="65" y="34" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">Sitio Neutral (Cloud)</text>
        </g>

        <path d="M 200 220 L 200 114 L 480 114" fill="none" stroke="var(--outline)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
        <path d="M 440 220 L 440 114 L 480 114" fill="none" stroke="var(--outline)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>

        <!-- ================= DATA CENTER 1 (PRINCIPAL) ================= -->
        <g id="dc1-group" class="node-element">
          <rect x="20" y="160" width="280" height="250" rx="16" fill="var(--surface-dim)" stroke="var(--outline)" stroke-width="1.2" stroke-dasharray="4 4"/>
          <rect x="35" y="172" width="150" height="24" rx="12" fill="var(--surface-bright)"/>
          <text x="110" y="188" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="12" font-weight="500" fill="var(--on-surface)">Data Center 1 (Sede A)</text>

          <g id="dc1-compute" transform="translate(40, 210)">
            <rect id="dc1-compute-bg" x="0" y="0" width="240" height="64" rx="12" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1.5"/>
            <text x="120" y="26" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" font-weight="500" fill="var(--on-surface)">Clúster Cómputo Core</text>
            <text id="dc1-compute-sub" x="120" y="44" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--primary)">ACTIVO • OBM / Transacciones</text>
          </g>

          <path id="path-dc1-internal" d="M 160 274 L 160 306" fill="none" stroke="var(--primary)" stroke-width="1.6" marker-end="url(#caret-active)" class="flow-line"/>

          <g id="dc1-san" transform="translate(40, 316)">
            <rect id="dc1-san-bg" x="0" y="0" width="240" height="64" rx="12" fill="var(--surface-container)" stroke="var(--primary)" stroke-width="1.5"/>
            <text x="120" y="26" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" font-weight="500" fill="var(--on-surface)">SAN All-Flash Principal</text>
            <text x="120" y="44" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">Volúmenes NVMe-oF</text>
          </g>
        </g>

        <!-- ================= DATA CENTER 2 (ALTERNO) ================= -->
        <g id="dc2-group" class="node-element">
          <rect x="340" y="160" width="280" height="250" rx="16" fill="var(--surface-dim)" stroke="var(--outline)" stroke-width="1.2" stroke-dasharray="4 4"/>
          <rect x="355" y="172" width="170" height="24" rx="12" fill="var(--surface-bright)"/>
          <text x="440" y="188" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="12" font-weight="500" fill="var(--on-surface)">Data Center 2 (Alterno 35 km)</text>

          <g id="dc2-compute" transform="translate(360, 210)">
            <rect id="dc2-compute-bg" x="0" y="0" width="240" height="64" rx="12" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="120" y="26" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" font-weight="500" fill="var(--on-surface)">Clúster Cómputo Standby</text>
            <text id="dc2-compute-sub" x="120" y="44" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">STANDBY • Listo para Failover</text>
          </g>

          <path id="path-dc2-internal" d="M 480 274 L 480 306" fill="none" stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"/>

          <g id="dc2-san" transform="translate(360, 316)">
            <rect id="dc2-san-bg" x="0" y="0" width="240" height="64" rx="12" fill="var(--surface-container)" stroke="var(--outline)" stroke-width="1.2"/>
            <text x="120" y="26" text-anchor="middle" font-family="var(--ff-sans, 'Google Sans Flex', sans-serif)" font-size="13" font-weight="500" fill="var(--on-surface)">SAN All-Flash Espejo</text>
            <text id="dc2-san-sub" x="120" y="44" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">Réplica Síncrona en Bloque</text>
          </g>
        </g>

        <!-- ================= ENLACES TRAFICO GSLB -> DCs ================= -->
        <path id="path-gslb-dc1" d="M 280 136 L 280 170 Q 280 180 265 180 L 160 180 L 160 202"
              fill="none" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#caret-active)" class="flow-line"/>

        <path id="path-gslb-dc2" d="M 360 136 L 360 170 Q 360 180 375 180 L 480 180 L 480 202"
              fill="none" stroke="var(--stroke-default)" stroke-width="1.3" stroke-dasharray="0 4"/>

        <!-- ================= INTERCONEXION INTER-DC DWDM ================= -->
        <g id="interconnect-group">
          <path id="path-fiber-a" d="M 280 338 L 352 338" fill="none" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#caret-active)" class="flow-line"/>
          <path id="path-fiber-b" d="M 280 358 L 352 358" fill="none" stroke="var(--primary)" stroke-width="1.8" marker-end="url(#caret-active)" class="flow-line"/>

          <g id="rep-pill" transform="translate(320, 348)">
            <rect x="-65" y="-12" width="130" height="24" rx="12" fill="var(--surface-bright)" stroke="var(--primary)" stroke-width="1"/>
            <text id="rep-pill-text" x="0" y="4" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" font-weight="500" fill="var(--primary)">Síncrono (RPO=0)</text>
          </g>

          <text x="320" y="380" text-anchor="middle" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface-variant)">Doble Anillo Fibra Oscura DWDM (&lt;3ms)</text>
        </g>

        <!-- ================= OVERLAY DE FALLA (DC1 OUTAGE) ================= -->
        <g id="failover-overlay" style="display: none;" aria-hidden="true">
          <circle cx="160" cy="180" r="12" fill="var(--error-container)" stroke="var(--error)" stroke-width="1.5"/>
          <path d="M 154 174 L 166 186 M 166 174 L 154 186" stroke="var(--error)" stroke-width="2" stroke-linecap="round" fill="none" />

          <circle cx="320" cy="348" r="12" fill="var(--error-container)" stroke="var(--error)" stroke-width="1.5"/>
          <path d="M 314 342 L 326 354 M 326 342 L 314 354" stroke="var(--error)" stroke-width="2" stroke-linecap="round" fill="none" />
        </g>

        <!-- ================= LEYENDA INFERIOR ================= -->
        <g transform="translate(20, 435)">
          <line x1="0" y1="0" x2="600" y2="0" stroke="var(--stroke-default)" stroke-width="1"/>

          <rect x="20" y="12" width="12" height="12" rx="3" fill="var(--accent-container)" stroke="var(--primary)" stroke-width="1"/>
          <text x="38" y="22" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface)">Ruta / Cómputo Activo</text>

          <rect x="210" y="12" width="12" height="12" rx="3" fill="var(--surface-bright)" stroke="var(--outline)" stroke-width="1"/>
          <text x="228" y="22" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface)">Standby / Pasivo</text>

          <line x1="370" y1="18" x2="400" y2="18" stroke="var(--primary)" stroke-width="2" stroke-dasharray="4 4"/>
          <text x="408" y="22" font-family="var(--ff-mono, 'Google Sans Code', monospace)" font-size="12" fill="var(--on-surface)">Replicación en Bloque DWDM</text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ---------- Element registry (all exist in markup) ----------
      var els = {
        btnNormal:    document.getElementById('btn-normal'),
        btnFailover:  document.getElementById('btn-failover'),
        statusBadge:  document.getElementById('status-badge'),
        statusText:   document.getElementById('status-text'),
        metricRpo:    document.getElementById('metric-rpo'),
        metricLat:    document.getElementById('metric-latency'),
        metricRto:    document.getElementById('metric-rto'),
        gslbRect:     document.getElementById('gslb-rect'),
        gslbSub:      document.getElementById('gslb-sub'),
        dc1Group:     document.getElementById('dc1-group'),
        dc1ComputeBg: document.getElementById('dc1-compute-bg'),
        dc1ComputeSub:document.getElementById('dc1-compute-sub'),
        dc1SanBg:     document.getElementById('dc1-san-bg'),
        dc2ComputeBg: document.getElementById('dc2-compute-bg'),
        dc2ComputeSub:document.getElementById('dc2-compute-sub'),
        dc2SanBg:     document.getElementById('dc2-san-bg'),
        dc2SanSub:    document.getElementById('dc2-san-sub'),
        pathGslbDc1:  document.getElementById('path-gslb-dc1'),
        pathGslbDc2:  document.getElementById('path-gslb-dc2'),
        pathDc1Int:   document.getElementById('path-dc1-internal'),
        pathDc2Int:   document.getElementById('path-dc2-internal'),
        pathFiberA:   document.getElementById('path-fiber-a'),
        pathFiberB:   document.getElementById('path-fiber-b'),
        repPillText:  document.getElementById('rep-pill-text'),
        failoverOverlay: document.getElementById('failover-overlay')
      };

      // Ensure we have everything; if not, bail gracefully.
      for (var k in els) {
        if (!els[k]) { console.warn('Missing element:', k); }
      }

      // ---------- State ----------
      var currentState = 'normal';

      // ---------- Helper ----------
      function toggle(el, cls, on) {
        if (!el) return;
        if (on) el.classList.add(cls);
        else    el.classList.remove(cls);
      }

      // ---------- Visualization update ----------
      function updateViz() {
        var failover = currentState === 'failover';

        // Buttons (ARIA + visual)
        toggle(els.btnNormal,   'active', !failover);
        toggle(els.btnFailover, 'active',  failover);
        if (els.btnNormal)   els.btnNormal.setAttribute('aria-pressed',   String(!failover));
        if (els.btnFailover) els.btnFailover.setAttribute('aria-pressed', String(failover));

        // Status badge
        toggle(els.statusBadge, 'normal',   !failover);
        toggle(els.statusBadge, 'failover',  failover);
        if (els.statusText) {
          els.statusText.textContent = failover
            ? 'Falla DC1 - Failover a DC2'
            : 'Operación Normal';
        }

        // Metrics
        if (els.metricRpo) {
          els.metricRpo.textContent = failover ? '0 (Datos Protegidos)' : '0 (Cero Pérdida)';
          toggle(els.metricRpo, 'positive', failover);
        }
        if (els.metricLat) {
          els.metricLat.textContent = failover ? 'N/A (Sede 1 Offline)' : '< 2.8 ms';
        }
        if (els.metricRto) {
          els.metricRto.textContent = failover ? '8.4 seg (Completado)' : '< 15 seg (Auto)';
        }

        // GSLB
        if (els.gslbRect) {
          els.gslbRect.setAttribute('fill',   failover ? 'var(--error-container)' : 'var(--accent-container)');
          els.gslbRect.setAttribute('stroke', failover ? 'var(--error)'           : 'var(--primary)');
        }
        if (els.gslbSub) {
          els.gslbSub.textContent = failover ? 'Ruta: DC2 (Conmutado)' : 'Ruta: DC1 Principal';
          els.gslbSub.setAttribute('fill', failover ? 'var(--error)' : 'var(--primary)');
        }

        // DC1
        toggle(els.dc1Group, 'fade-dim', failover);
        if (els.dc1ComputeBg) {
          els.dc1ComputeBg.setAttribute('fill',         failover ? 'var(--surface-dim)' : 'var(--accent-container)');
          els.dc1ComputeBg.setAttribute('stroke',       failover ? 'var(--error)'       : 'var(--primary)');
          els.dc1ComputeBg.setAttribute('stroke-width', failover ? '1'                 : '1.5');
        }
        if (els.dc1ComputeSub) {
          els.dc1ComputeSub.textContent = failover ? 'FUERA DE SERVICIO (CAÍDO)' : 'ACTIVO • OBM / Transacciones';
          els.dc1ComputeSub.setAttribute('fill', failover ? 'var(--error)' : 'var(--primary)');
        }
        if (els.dc1SanBg) {
          els.dc1SanBg.setAttribute('fill',   failover ? 'var(--surface-dim)' : 'var(--surface-container)');
          els.dc1SanBg.setAttribute('stroke', failover ? 'var(--error)'       : 'var(--primary)');
        }
        if (els.pathDc1Int) {
          els.pathDc1Int.setAttribute('stroke',       failover ? 'var(--error)' : 'var(--primary)');
          els.pathDc1Int.setAttribute('stroke-width', failover ? '1'            : '1.6');
          els.pathDc1Int.setAttribute('marker-end',   failover ? ''             : 'url(#caret-active)');
          toggle(els.pathDc1Int, 'flow-line', !failover);
        }

        // DC2
        if (els.dc2ComputeBg) {
          els.dc2ComputeBg.setAttribute('fill',         failover ? 'var(--accent-container)' : 'var(--surface-bright)');
          els.dc2ComputeBg.setAttribute('stroke',       failover ? 'var(--primary)'          : 'var(--outline)');
          els.dc2ComputeBg.setAttribute('stroke-width', failover ? '1.5'                    : '1.2');
        }
        if (els.dc2ComputeSub) {
          els.dc2ComputeSub.textContent = failover
            ? 'ACTIVO (PROMOVIDO A PRIMARIO)'
            : 'STANDBY • Listo para Failover';
          els.dc2ComputeSub.setAttribute('fill', failover ? 'var(--primary)' : 'var(--on-surface-variant)');
        }
        if (els.dc2SanBg) {
          els.dc2SanBg.setAttribute('stroke', failover ? 'var(--primary)' : 'var(--outline)');
        }
        if (els.dc2SanSub) {
          els.dc2SanSub.textContent = failover
            ? 'Lectura / Escritura Local (Primario)'
            : 'Réplica Síncrona en Bloque';
        }
        if (els.pathDc2Int) {
          els.pathDc2Int.setAttribute('stroke',       failover ? 'var(--primary)' : 'var(--stroke-default)');
          els.pathDc2Int.setAttribute('stroke-width', failover ? '1.6'           : '1.3');
          els.pathDc2Int.setAttribute('marker-end',   failover ? 'url(#caret-active)' : '');
          toggle(els.pathDc2Int, 'flow-line', failover);
        }

        // Routes GSLB -> DCs
        if (els.pathGslbDc1) {
          els.pathGslbDc1.setAttribute('stroke',       failover ? 'var(--error)' : 'var(--primary)');
          els.pathGslbDc1.setAttribute('stroke-width', failover ? '1'            : '1.8');
          els.pathGslbDc1.setAttribute('marker-end',   failover ? ''             : 'url(#caret-active)');
          toggle(els.pathGslbDc1, 'flow-line',    !failover);
          toggle(els.pathGslbDc1, 'route-broken',  failover);
        }
        if (els.pathGslbDc2) {
          els.pathGslbDc2.setAttribute('stroke',       failover ? 'var(--primary)' : 'var(--stroke-default)');
          els.pathGslbDc2.setAttribute('stroke-width', failover ? '1.8'           : '1.3');
          els.pathGslbDc2.setAttribute('marker-end',   failover ? 'url(#caret-active)' : '');
          toggle(els.pathGslbDc2, 'flow-line', failover);
        }

        // Fibers DWDM
        [els.pathFiberA, els.pathFiberB].forEach(function (p) {
          if (!p) return;
          p.setAttribute('stroke',       failover ? 'var(--error)' : 'var(--primary)');
          p.setAttribute('stroke-width', failover ? '1'            : '1.8');
          p.setAttribute('marker-end',   failover ? ''             : 'url(#caret-active)');
          toggle(p, 'flow-line',    !failover);
          toggle(p, 'fiber-broken',  failover);
        });

        // Rep pill
        if (els.repPillText) {
          els.repPillText.textContent = failover ? 'Enlace Interrumpido' : 'Síncrono (RPO=0)';
          els.repPillText.setAttribute('fill', failover ? 'var(--error)' : 'var(--primary)');
        }

        // Overlay markers
        if (els.failoverOverlay) {
          els.failoverOverlay.style.display = failover ? 'block' : 'none';
        }
      }

      // ---------- State switcher ----------
      function switchState(state) {
        if (state !== 'normal' && state !== 'failover') return;
        currentState = state;
        updateViz();
      }

      // ---------- Wire controls ----------
      if (els.btnNormal)   els.btnNormal.addEventListener('click',   function () { switchState('normal'); });
      if (els.btnFailover) els.btnFailover.addEventListener('click', function () { switchState('failover'); });

      // ---------- Initial render ----------
      updateViz();

      // ---------- Host-driven theme ----------
      function applyTheme(t) {
        if (t !== 'dark' && t !== 'light') return;
        document.documentElement.setAttribute('data-theme', t);
        updateViz();
      }

      if (!document.documentElement.hasAttribute('data-theme') &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }

      window.addEventListener('message', function (e) {
        if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
          applyTheme(e.data.theme);
        }
      });

      // ---------- Auto-resize iframe ----------
      (function autoResize() {
        function notifyHeight() {
          var h = Math.ceil(Math.max(
            document.documentElement.scrollHeight || 0,
            document.body ? document.body.scrollHeight : 0
          ));
          if (h > 0) {
            try { window.parent.postMessage({ type: 'widget-resize', height: h }, '*'); } catch (err) {}
          }
        }
        window.addEventListener('load', function () { setTimeout(notifyHeight, 120); });
        if (typeof ResizeObserver === 'function') {
          try {
            new ResizeObserver(notifyHeight).observe(document.body);
          } catch (e) {}
        }
      })();
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
